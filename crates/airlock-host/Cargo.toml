[package]
name = "airlock-host"
version.workspace = true
edition.workspace = true

[features]
default = ["z3-prover"]
# Forwarded to shadow-verifier: real Z3 theorem prover vs. MockVerifier fallback.
z3-prover = ["shadow-verifier/z3-prover"]

[dependencies]
wasmtime.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
shannon-bottleneck = { path = "../shannon-bottleneck" }
ontological-sanitizer = { path = "../ontological-sanitizer" }
shadow-verifier = { path = "../shadow-verifier", default-features = false }

[dev-dependencies]
wat.workspace = true

[[bin]]
name = "airlock-host"
path = "src/main.rs"

[lib]
name = "airlock_host"
path = "src/lib.rs"
